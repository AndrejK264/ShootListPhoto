<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shoot List</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#111;--card:#1c1c1e;--fg:#f2f2f2;--mut:#8e8e93;--acc:#ffb400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:90px}
header{display:flex;align-items:center;gap:10px;padding:16px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:22px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:inherit;border:0;background:none}
.back{font-size:26px;padding:0 8px}
.list{padding:0 16px;display:grid;gap:10px}
.card{background:var(--card);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.card .body{flex:1;min-width:0}
.card .t{font-weight:600}.card .s{color:var(--mut);font-size:14px;margin-top:2px}
.del{color:#ff453a;font-size:20px;padding:6px 10px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;flex:none;font-size:18px;color:transparent}
.done .chk{background:var(--acc);border-color:var(--acc);color:#000}
.done .t,.done .s{color:#555;text-decoration:line-through}
.done{opacity:.7}
.time{color:var(--acc);font-size:14px;font-weight:600}.done .time{color:#555}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--acc);color:#000;font-weight:700;padding:14px 20px;border-radius:30px;box-shadow:0 4px 14px #0008}
.empty{color:var(--mut);text-align:center;padding:40px 20px}
.modal{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;display:grid;gap:12px}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
input,textarea{font:inherit;color:var(--fg);background:#2c2c2e;border:0;border-radius:10px;padding:12px;width:100%}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{background:var(--acc);color:#000;font-weight:700;padding:13px;border-radius:12px}
.btn.g{background:#2c2c2e;color:var(--fg)}.btn.r{background:#2c2c2e;color:#ff453a}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:84px;height:84px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.ph b{position:absolute;top:-6px;right:-6px;background:#ff453a;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px}
.add{width:84px;height:84px;border-radius:10px;border:2px dashed var(--mut);color:var(--mut);font-size:28px}
.big{position:fixed;inset:0;background:#000;z-index:20;display:grid;place-items:center}
.big img{max-width:100%;max-height:100%}
</style></head>
<body><div id="app"></div><script src="app.js"></script></body></html>
